<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pridať krúžok</title>

    <style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #111827;
    --text: #e5e7eb;
    --text-2: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* TOPBAR */
.topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 25px;
    background: var(--card-2);
    border-bottom: 1px solid #243042;
}

.topbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
}

.dot {
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
}

.topbar-title {
    color: var(--text-2);
}

/* MAIN */
.main {
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* HEADER */
.page-header {
    text-align: center;
    margin-bottom: 30px;
}

.page-header h1 {
    font-size: 32px;
    margin: 0;
}

.page-header p {
    color: var(--text-2);
}

/* FORM */
form {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* INPUT CARDS */
.stat-card {
    background: var(--card);
    padding: 15px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid #243042;
}

.stat-card label {
    font-size: 13px;
    color: var(--text-2);
}

/* INPUTY */
input, select, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0b1220;
    color: white;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
}

/* BUTTON */
.filter-btn {
    background: var(--accent);
    color: white;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    border: none;
    cursor: pointer;
    transition: 0.2s;
}

.filter-btn:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
}
    </style>
</head>

<body>

<nav class="topbar">
    <div class="topbar-logo">
        <div class="dot"></div>
        Škola
    </div>
    <span class="topbar-title">Pridanie krúžku</span>
</nav>

<main class="main">

    <div class="page-header">
        <h1>➕ Pridať krúžok</h1>
        <p>Vyplň údaje o novom krúžku</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="stat-card">
            <label>Názov krúžku</label>
            {{ form.nazov }}
        </div>

        <div class="stat-card">
            <label>Miestnosť</label>
            {{ form.miestnost }}
        </div>

        <div class="stat-card">
            <label>Deň a čas</label>
            {{ form.den }}
        </div>

        <div class="stat-card">
            <label>Vedúci</label>
            {{ form.veduci }}
        </div>

        <button type="submit" class="filter-btn">
            Uložiť krúžok
        </button>
    </form>

    <div style="margin-top:20px;">
        <a href="{% url 'zoznam_kruzkov' %}" class="filter-btn">
            ← Späť
        </a>
    </div>

</main>

</body>
</html>
