<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Úspech</title>

    <style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #111827;
    --text: #e5e7eb;
    --text-2: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* MAIN */
.main {
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* CARD */
.success-card {
    background: var(--card);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid #243042;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.success-card h1 {
    margin: 0 0 10px 0;
    font-size: 28px;
}

.success-card p {
    color: var(--text-2);
    margin-bottom: 20px;
}

/* BUTTON */
.filter-btn {
    background: var(--accent);
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
    transition: 0.2s;
}

.filter-btn:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
}
    </style>
</head>
<body>

<main class="main">

    <div class="success-card">
        <h1>✅ Úspešne odoslané</h1>
        <p>Tvoja prihláška bola prijatá.</p>

        <a href="{% url 'zoznam_kruzkov' %}" class="filter-btn">
            Späť na krúžky
        </a>
    </div>

</main>

</body>
</html>
